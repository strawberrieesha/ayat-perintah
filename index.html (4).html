<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Ayat Perintah</title><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#20345b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 15%,#fff5a8,transparent 30%),radial-gradient(circle at 85% 25%,#ffc3dc,transparent 30%),linear-gradient(140deg,#a3e7ff,#c9b9ff 55%,#b5f5d2);padding:20px}.shell{max-width:1060px;margin:auto}.top{background:#ffffffdc;border:4px solid white;border-radius:30px;box-shadow:0 14px 35px #37548c2a;padding:20px 25px;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.top h1{font-size:clamp(27px,5vw,47px);margin:0;color:#6637b5;text-shadow:2px 3px #fce17c}.top p{margin:5px 0 0}.score{background:#fff1a4;border:3px solid #efb849;padding:12px 18px;border-radius:18px;font-weight:900}.panel{background:#fffef7;border:4px solid #fff;border-radius:30px;box-shadow:0 12px 30px #38509b2a;padding:clamp(18px,4vw,35px);margin-top:22px}.nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.nav button{flex:1;min-width:170px}button{cursor:pointer;border:0;border-radius:15px;padding:13px 19px;font:900 17px 'Trebuchet MS',Arial,sans-serif;background:#7757d6;color:white;box-shadow:0 5px 0 #4d32a0;transition:.15s}button:hover{transform:translateY(-2px);filter:brightness(1.06)}button:active{transform:translateY(3px);box-shadow:0 2px 0 #4d32a0}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.nav button.active{background:#f25391;box-shadow:0 5px 0 #b72e64}.secondary{background:#159a94;box-shadow:0 5px 0 #086c67}.light{background:#ecf1ff;color:#303e78;box-shadow:0 5px 0 #a6b4d9}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:22px 0}.choices button{background:#e9e4ff;color:#35235c;box-shadow:0 5px 0 #b9a9ef;text-align:left;min-height:70px}.choices button.correct{background:#b4f4c4;box-shadow:0 5px 0 #4bba6b}.choices button.wrong{background:#ffd2d2;box-shadow:0 5px 0 #ed8282}.tag{display:inline-block;background:#e5dcff;color:#653ab1;padding:8px 13px;border-radius:30px;font-weight:900}.prompt{font-size:clamp(22px,3.5vw,32px);font-weight:900;line-height:1.35;margin:22px 0}.feedback{background:#fff4cb;border-radius:15px;padding:15px;margin:16px 0;font-size:17px;min-height:52px}.bottom{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}.progress{height:13px;background:#e6e2f5;border-radius:99px;overflow:hidden;margin-top:15px}.bar{height:100%;background:#36bd9b;transition:.3s}.scenario{font-size:80px;text-align:center;background:linear-gradient(120deg,#e9f9ff,#fdf0ff);border-radius:25px;padding:20px;margin:15px 0}.hint{color:#556783;font-size:15px}.answer{width:100%;border:3px solid #baa7ec;border-radius:16px;padding:16px;font:19px 'Trebuchet MS',Arial,sans-serif;min-height:110px;resize:vertical}.rubric{background:#eaf8f1;border:2px dashed #61b995;border-radius:18px;padding:18px;margin:15px 0}.rubric label{display:block;margin:12px 0;font-size:17px}.rubric input{width:21px;height:21px;vertical-align:middle}.hidden{display:none!important}.hero{text-align:center;padding:30px 8px}.hero .emoji{font-size:90px}.hero h2{font-size:clamp(27px,5vw,44px);color:#f15a87;margin:10px 0}.hero p{font-size:20px;max-width:700px;margin:12px auto 25px;line-height:1.6}.foot{text-align:center;margin:18px;color:#344d7c;font-weight:bold}.small{font-size:14px}.groupInput{padding:12px;border-radius:12px;border:2px solid #bba9e9;font-size:18px;width:min(330px,100%)}@media(max-width:620px){.choices{grid-template-columns:1fr}.top{justify-content:center;text-align:center}.nav button{min-width:100%}}
.audioBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:15px;background:#ffffffd9;border-radius:20px;padding:13px}.audioBar button{font-size:14px;padding:10px}.audioBar label{font-weight:bold}.audioBar input{vertical-align:middle;width:130px}button:focus-visible{outline:4px solid #ffbf33;outline-offset:3px}@media(max-width:620px){.audioBar{justify-content:center}} </style></head><body><div class="shell"><header class="top"><div><h1>🚀 MISI AYAT PERINTAH</h1><p>Belajar sambil bermain • Bahasa Melayu Tahun 5</p></div><div class="score" id="score">⭐ Markah: 0</div></header><nav class="nav" id="nav"><button id="tab1" onclick="go(1)">🔎 Misi 1</button><button id="tab2" onclick="go(2)">🧩 Misi 2</button><button id="tab3" onclick="go(3)">✍️ Misi 3</button></nav><div class="audioBar"><button id="musicToggle" onclick="toggleMusic()">🎵 Muzik: HIDUP</button><button id="fxToggle" onclick="toggleFx()">🔊 Kesan bunyi: HIDUP</button><label>🎚️ Kelantangan <input type="range" id="volume" min="0" max="100" value="85" oninput="updateVolume()"></label><button class="light" onclick="resetGame()">🔄 MAIN SEMULA</button></div><main class="panel" id="main"></main><p class="foot">🌈 Tiada had masa • Berbincang dengan ahli kumpulan • Selamat mencuba!</p></div><script>
const questions1=[['“Sila masuk ke dalam kelas.”','Ayat Silaan'],['“Jangan bermain di tepi jalan.”','Ayat Larangan'],['“Tolong ambilkan buku itu.”','Ayat Permintaan'],['“Susun kerusi dengan kemas.”','Ayat Suruhan'],['“Usah bimbang tentang perkara itu.”','Ayat Larangan']];
const questions2=[['_____ tutup pintu sebelum keluar.','Sila',['Sila','Jangan','Tolong','Usah']],['_____ membuang sampah merata-rata.','Jangan',['Jangan','Sila','Tolong','Jemput']],['_____ bantu saya membawa buku ini.','Tolong',['Tolong','Jangan','Usah','Sila']],['_____ duduk di tempat yang disediakan.','Silalah',['Silalah','Janganlah','Usah','Tolong']],['_____ botol plastik itu dengan berhati-hati.','Potong',['Potong','Jangan','Sila','Tolong']]];
const situations=[['🧹🏫','Kelas kamu bersepah. Bina satu ayat suruhan untuk mengajak rakan melakukan tugas.','Suruhan'],['📵🏫','Seorang rakan mahu menggunakan telefon bimbit semasa pengajaran. Bina satu ayat larangan.','Larangan'],['🚪😊','Seorang tetamu datang ke kelas. Bina satu ayat silaan yang sopan.','Silaan'],['📚🤝','Kamu memerlukan bantuan rakan untuk mengangkat buku. Bina satu ayat permintaan.','Permintaan'],['🌱💧','Kamu sedang menjalankan projek tanaman. Bina satu ayat suruhan yang sesuai.','Suruhan']];
let stage=0,idx={1:0,2:0,3:0},scores={1:0,2:0,3:0},answered={1:{},2:{},3:{}},team='',muted=false;
const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Semua audio dijana sendiri melalui Web Audio API; tiada fail luaran diperlukan.
let audioCtx=null, musicOn=true,fxOn=true,volume=.85,musicTimer=null,beat=0;
const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,659.25,783.99,987.77,783.99,587.33,659.25,523.25,392];
function audio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,dur=.16,type='sine',gain=.16,when=0){const c=audio();if(!c)return;let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain*volume),t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
function musicBeat(){if(!musicOn)return;let n=melody[beat%melody.length];tone(n,.23,'triangle',.19);if(beat%2===0)tone(n/2,.35,'sine',.095);if(beat%4===0)tone(130.81,.12,'triangle',.075);beat++}
function startMusic(){if(!musicOn||musicTimer)return;audio();musicBeat();musicTimer=setInterval(musicBeat,310)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function toggleMusic(){musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();document.getElementById('musicToggle').textContent='🎵 Muzik: '+(musicOn?'HIDUP':'MATI')}
function toggleFx(){fxOn=!fxOn;document.getElementById('fxToggle').textContent='🔊 Kesan bunyi: '+(fxOn?'HIDUP':'MATI');if(fxOn)sound(true)}
function updateVolume(){volume=Number(document.getElementById('volume').value)/100}
function sound(ok=true){if(!fxOn)return;if(ok){tone(659,.14,'square',.30);tone(880,.18,'triangle',.36,.13);tone(1175,.32,'triangle',.34,.29)}else{tone(360,.20,'sawtooth',.31);tone(240,.27,'sawtooth',.32,.19);tone(175,.34,'triangle',.32,.39)}}
function clickSound(){if(fxOn)tone(620,.085,'triangle',.20)}
// Browser hanya membenarkan muzik bermula selepas interaksi pengguna.
document.addEventListener('pointerdown',()=>{if(musicOn)startMusic()},{once:true});
function refresh(){document.getElementById('score').textContent='⭐ Markah: '+Object.values(scores).reduce((a,b)=>a+b,0);for(let i=1;i<=3;i++)document.getElementById('tab'+i).classList.toggle('active',stage===i)}
function go(n){clickSound();stage=n;refresh();render()};function start(){startMusic();team=document.getElementById('team').value.trim()||'Pasukan Hebat';go(1)}
function home(){stage=0;refresh();render()};function resetGame(){clickSound();idx={1:0,2:0,3:0};scores={1:0,2:0,3:0};answered={1:{},2:{},3:{}};team='';stage=0;beat=0;home();window.scrollTo({top:0,behavior:'smooth'})}function reset(){resetGame()}
function next(){clickSound();idx[stage]++;render()};function prev(){clickSound();idx[stage]=Math.max(0,idx[stage]-1);render()}
function render(){refresh();if(stage===0){main.innerHTML=`<div class="hero"><div class="emoji">🎁🎲✨</div><h2>Selamat Datang, Wira Bahasa!</h2><p>Selesaikan tiga misi, kumpul bintang dan buktikan kamu pakar ayat perintah! Misi bina ayat menerima pelbagai jawapan yang sesuai dan dinilai oleh guru.</p><p><input id="team" class="groupInput" placeholder="Nama kumpulan" value="${esc(team)}"></p><button onclick="start()">🚀 MULA BERMAIN</button><p class="small">Guru boleh memilih mana-mana misi melalui butang di atas.</p></div>`;return}const total=5,n=idx[stage];if(n>=total){const nextStage=stage+1;main.innerHTML=`<div class="hero"><div class="emoji">🏆🎉🌟</div><h2>Syabas, ${esc(team||'Wira Bahasa')}!</h2><p>Misi ${stage} selesai! Kamu telah memperoleh <b>${scores[stage]} markah</b> dalam misi ini.</p><button onclick="${nextStage<=3?'go('+nextStage+')':'showFinal()'}">${nextStage<=3?'➡️ TERUSKAN MISI '+nextStage:'🏅 LIHAT KEPUTUSAN'}</button><button class="light" onclick="idx[stage]=0;render()">🔁 Lihat semula misi</button></div>`;return}if(stage===3)return renderFree();let q=stage===1?questions1[n]:questions2[n];let opts=stage===1?['Ayat Suruhan','Ayat Larangan','Ayat Silaan','Ayat Permintaan']:q[2];let a=answered[stage][n];main.innerHTML=`<span class="tag">MISI ${stage} • SOALAN ${n+1} DARIPADA ${total}</span><div class="progress"><div class="bar" style="width:${n/total*100}%"></div></div><h2>${stage===1?'🔎 Kenali Saya!':'🧩 Lengkapkan Saya!'}</h2><p class="hint">${stage===1?'Pilih jenis ayat perintah yang betul.':'Pilih perkataan paling sesuai untuk melengkapkan ayat.'}</p><div class="prompt">${esc(q[0])}</div><div class="choices">${opts.map((o,i)=>`<button class="${a?(o===q[1]?'correct':o===a.choice?'wrong':''):''}" ${a?'disabled':''} onclick="choose(${i})">${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback">${a?(a.correct?'🌟 Tepat! Bagus sekali.':'💡 Jawapan yang sesuai: '+esc(q[1])+'.'):'Pilih satu jawapan untuk meneruskan.'}</div><div class="bottom"><button class="light" onclick="prev()" ${n===0?'disabled':''}>⬅️ Sebelumnya</button><button class="secondary" onclick="next()" ${!a?'disabled':''}>${n===total-1?'Selesaikan misi 🏁':'Soalan seterusnya ➡️'}</button></div>`}
function choose(i){const q=stage===1?questions1[idx[stage]]:questions2[idx[stage]],opts=stage===1?['Ayat Suruhan','Ayat Larangan','Ayat Silaan','Ayat Permintaan']:q[2];if(answered[stage][idx[stage]])return;let choice=opts[i],correct=choice===q[1];answered[stage][idx[stage]]={choice,correct};if(correct)scores[stage]+=10;sound(correct);render()}
function renderFree(){const n=idx[3],s=situations[n],a=answered[3][n];main.innerHTML=`<span class="tag">MISI 3 • CABARAN ${n+1} DARIPADA 5</span><div class="progress"><div class="bar" style="width:${n/5*100}%"></div></div><h2>✍️ Bina Ayat Hebat!</h2><p class="hint">Tiada jawapan tetap. Tulis ayat kamu sendiri. Tulis ayat sendiri dan tekan Hantar. Selepas itu, tekan Cabaran seterusnya. Guru boleh menyemak dan membetulkan ayat jika perlu.</p><div class="scenario">${s[0]}</div><div class="prompt">${esc(s[1])}</div><label for="free"><b>Ayat ciptaan kamu:</b></label><textarea id="free" class="answer" placeholder="Taip ayat perintah kamu di sini..." ${a?'readonly':''}>${a?esc(a.text):''}</textarea><div id="judge">${a?rubricHtml(a):'<div class="feedback">💡 Gunakan ayat yang jelas, sopan dan sesuai dengan situasi.</div><button onclick="submitFree()">📩 HANTAR AYAT & TERUSKAN</button>'}</div><div class="bottom"><button class="light" onclick="prev()" ${n===0?'disabled':''}>⬅️ Sebelumnya</button><button class="secondary" onclick="next()" ${!a?'disabled':''}>${n===4?'Selesaikan misi 🏁':'Cabaran seterusnya ➡️'}</button></div>`}
function submitFree(){const t=document.getElementById('free').value.trim();if(t.length<5){alert('Tulis ayat yang lengkap dahulu.');return}answered[3][idx[3]]={text:t,graded:true,accepted:true};scores[3]+=10;sound();render()}
function rubricHtml(a){if(a.graded)return `<div class="feedback">${a.accepted?'🌟 Ayat telah direkodkan! +10 markah sementara (guru boleh semak)':'💡 Ayat belum memenuhi kriteria. Guru boleh berbincang dengan murid.'}</div><button class="light" onclick="editFree()">✏️ Betulkan ayat</button>`;return `<div class="rubric"><b>👩‍🏫 Semakan guru (jawapan terbuka)</b><p><b>Jenis ayat disasarkan:</b> Ayat ${situations[idx[3]][2]}</p><p><b>Jawapan murid:</b> “${esc(a.text)}”</p><label><input type="checkbox" id="c1"> Ayat sesuai dengan situasi dan jenis yang diminta</label><label><input type="checkbox" id="c2"> Ayat gramatis dan maksudnya jelas</label><label><input type="checkbox" id="c3"> Ejaan dan tanda baca sesuai</label><p class="hint">Tiada padanan dengan satu jawapan contoh. Guru boleh menerima mana-mana ayat yang menepati kriteria.</p><button onclick="grade(true)">✅ Terima jawapan (+10)</button> <button class="light" onclick="grade(false)">🔄 Perlu bimbingan</button></div>`}
function grade(accept){const a=answered[3][idx[3]];if(accept&&(!document.getElementById('c1').checked||!document.getElementById('c2').checked||!document.getElementById('c3').checked)){alert('Tandakan ketiga-tiga kriteria sebelum menerima jawapan.');return}a.graded=true;a.accepted=accept;if(accept)scores[3]+=10;sound(accept);render()}
function editFree(){const a=answered[3][idx[3]];if(a.accepted)scores[3]-=10;delete answered[3][idx[3]];render()}
function showFinal(){sound(true);stage=0;refresh();const total=Object.values(scores).reduce((a,b)=>a+b,0);main.innerHTML=`<div class="hero"><div class="emoji">🏆🎊🥳</div><h2>TAHNIAH, ${esc(team||'WIRA BAHASA')}!</h2><p>Kamu telah menamatkan ketiga-tiga misi ayat perintah.</p><h2>⭐ ${total} / 150 MARKAH ⭐</h2><p>Misi 1: ${scores[1]} / 50<br>Misi 2: ${scores[2]} / 50<br>Misi 3: ${scores[3]} / 50</p><button onclick="reset()">🔄 Main semula (permainan baharu)</button><button class="light" onclick="window.print()">🖨️ Cetak keputusan</button></div>`}
render();
</script></body></html>
